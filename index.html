<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>JSTV Studio</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;padding:0;background:#000;color:#fff;font-family:Arial,sans-serif;overflow:hidden !important;touch-action:pan-y !important;overscroll-behavior:none !important;position:fixed;width:100%;height:100%}
.page{display:none;width:100%;height:100%;overflow:hidden;touch-action:pan-y;padding:20px;text-align:center}
.page.show{display:block}
.logo{font-size:48px;font-weight:bold;color:gold;text-align:center;margin-top:60px}
.btn{display:block;width:90%;max-width:320px;margin:14px auto;padding:16px;background:gold;color:#000;border:0;border-radius:30px;font-size:18px;font-weight:bold}
.btn2{display:block;width:90%;max-width:320px;margin:10px auto;padding:12px;background:#222;color:#fff;border:1px solid #444;border-radius:20px}
input{width:90%;max-width:320px;padding:14px;margin:8px auto;display:block;border-radius:12px;border:1px solid #333;background:#111;color:#fff;font-size:16px}
#cam{width:100%;height:62vh;object-fit:cover;background:#111;border-radius:14px;touch-action:none}
.top{display:flex;justify-content:space-between;align-items:center;padding:6px}
.tabs button{border:0;background:transparent;color:#aaa;padding:10px 12px;font-size:16px}
.tabs button.on{color:#fff}
.badge{background:#00ff88;color:#000;padding:4px 10px;border-radius:12px;font-size:12px;font-weight:bold}
.row{display:flex;justify-content:space-between;gap:8px}
.row button{flex:1;padding:12px;background:#222;color:#fff;border:1px solid #444;border-radius:12px}
.row button.on{background:gold;color:#000}
.center{text-align:center}
</style>
</head>
<body>

<!-- ===== V1: SPLASH ===== -->
<div id="p1" class="page show">
  <div class="logo">JSTV</div>
  <h1 style="text-align:center">JSTV</h1>
  <p style="text-align:center;color:#aaa">Jesus Saves TV - Live Studio</p>
  <p style="text-align:center;color:gold;margin:10px">Jesus Is Lord</p>
  <button class="btn" onclick="show('p2')">START</button>
  <p style="text-align:center;color:#666;font-size:12px">Swipe Left = Next &nbsp;|&nbsp; Swipe Right = Back</p>
</div>

<!-- ===== V2: PERMISSIONS ===== -->
<div id="p2" class="page">
  <h2>Permissions</h2>
  <p style="color:#aaa">We need Camera & Mic to go LIVE</p>
  <button class="btn" onclick="askPerm()">OK - ALLOW</button>
  <button class="btn2" onclick="show('p3')">Next</button>
  <button class="btn2" onclick="show('p1')">Back</button>
</div>

<!-- ===== V3: LOGIN / VERIFY ===== -->
<div id="p3" class="page">
  <h2>Login</h2>
  <input id="phone" placeholder="Phone / Email">
  <input id="code" placeholder="Code - type 1234">
  <button class="btn" onclick="show('p4')">Verify & Done</button>
  <button class="btn2" onclick="show('p2')">Back</button>
  <p style="color:#666;font-size:12px">For test, tap Verify & Done</p>
</div>

<!-- ===== V4: STUDIO ===== -->
<div id="p4" class="page">
  <div class="top">
    <div><b>JSTV</b> <span class="badge">LIVE READY</span></div>
    <div><button onclick="show('p3')" style="background:transparent;color:#fff;border:0;font-size:22px">...</button></div>
  </div>

  <video id="cam" autoplay playsinline muted></video>

  <!-- BIG FLIP BUTTON - CANNOT MISS -->
  <button onclick="flip()" style="width:90%;max-width:320px;margin:10px auto;display:block;background:yellow;color:#000;border:0;padding:12px 22px;border-radius:20px;font-weight:bold;font-size:16px">🔄 FLIP - Front / Back</button>

  <div class="center">
    <div class="tabs">
      <button class="on" onclick="setMode('live',this)">Live</button>
      <button onclick="setMode('shorts',this)">Shorts</button>
      <button onclick="setMode('record',this)">Record</button>
    </div>
    <div class="row" style="margin-top:8px">
      <button class="on" onclick="setSrc('cam',this)">Camera</button>
      <button onclick="setSrc('screen',this)">Screen</button>
      <button onclick="setSrc('both',this)">Both</button>
    </div>
    <button class="btn" style="margin-top:14px" onclick="goLive()">● GO LIVE / Ready</button>
    <button class="btn2" onclick="show('p1')">Back to Home</button>
    <p style="color:#666;font-size:12px">Swipe Left / Right to change screen - screen will NOT move</p>
  </div>
</div>

<script>
function show(id){
  document.querySelectorAll('.page').forEach(p=>p.classList.remove('show'));
  document.getElementById(id).classList.add('show');
  if(id==='p4') startCam();
}
async function askPerm(){
  try{ await navigator.mediaDevices.getUserMedia({video:true,audio:true}); alert('Allowed! Tap Next'); show('p3'); }
  catch(e){ alert('Please Allow Camera + Mic in browser'); }
}
let mode='live', facing='user', stream=null, src='cam';
function setMode(m,el){ mode=m; document.querySelectorAll('.tabs button').forEach(b=>b.classList.remove('on')); el.classList.add('on'); }
function setSrc(s,el){ src=s; document.querySelectorAll('.row button').forEach(b=>b.classList.remove('on')); el.classList.add('on'); }
async function startCam(){
  try{
    if(stream) stream.getTracks().forEach(t=>t.stop());
    stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:{exact:facing}},audio:true});
    document.getElementById('cam').srcObject=stream;
  }catch(e){
    try{ stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:facing},audio:true}); document.getElementById('cam').srcObject=stream; }
    catch(e2){ console.log(e2); }
  }
}
function flip(){ facing=facing==='user'?'environment':'user'; startCam(); alert(facing==='user'?'Front Camera - You':'Back Camera - Church'); }
function goLive(){ alert('You are LIVE on JSTV - '+mode+' - '+src+' - Camera: '+(facing==='user'?'Front':'Back')); }

/* SWIPE = NEXT / PREV PAGE, NOT MOVE SCREEN */
let sx=0, sy=0;
let order=['p1','p2','p3','p4'];
document.addEventListener('touchstart',e=>{ sx=e.touches[0].clientX; sy=e.touches[0].clientY; },{passive:true});
document.addEventListener('touchend',e=>{
  let dx=e.changedTouches[0].clientX-sx;
  let dy=e.changedTouches[0].clientY-sy;
  if(Math.abs(dx)<80 || Math.abs(dy)>60) return;
  let curEl=document.querySelector('.page.show');
  let cur=order.indexOf(curEl?curEl.id:'p1');
  if(dx<-80 && cur<order.length-1) show(order[cur+1]);
  else if(dx>80 && cur>0) show(order[cur-1]);
},{passive:true});
</script>
</body>
</html>
