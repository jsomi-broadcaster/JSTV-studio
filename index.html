<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>JSTV Studio V115</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;font-family:Arial,sans-serif}
body{background:#000;color:#fff;overflow:hidden}
.screen{display:none;width:100%;min-height:100vh;flex-direction:column;align-items:center;justify-content:center;padding:16px}
.screen.active{display:flex}
.badge{background:#FFD700;color:#000;font-weight:900;font-size:24px;padding:8px 16px;border-radius:20px;margin-bottom:12px}
.btn{width:100%;max-width:400px;padding:20px;margin:8px 0;border:none;border-radius:30px;background:#fff;color:#000;font-weight:bold;font-size:24px}
.btnDark{background:transparent;color:#fff;text-decoration:underline;font-size:24px}
#mainScreen{padding:0;justify-content:flex-start;overflow:hidden}
#stage{width:100%;height:100vh;position:relative;background:#111;overflow:hidden}
#cam{width:100%;height:100%;display:block;background:#222;object-fit:cover}
#logoOverlay{position:absolute;top:58px;left:12px;width:95px;height:95px;object-fit:contain;display:block;z-index:10}
#titleOverlay{position:absolute;top:58px;left:0;right:0;text-align:center;font-size:24px;font-weight:900;text-shadow:2px 2px 4px #000;z-index:9}
#ticker{position:absolute;bottom:148px;left:0;right:0;background:rgba(0,0,0,.65);padding:7px;white-space:nowrap;overflow:hidden;z-index:9}
#ticker span{display:inline-block;animation:scroll 15s linear infinite;color:#FFD700;font-weight:bold;font-size:24px}
@keyframes scroll{from{transform:translateX(100%)}to{transform:translateX(-100%)}}
#topBar{position:absolute;top:0;left:0;right:0;display:flex;justify-content:space-between;align-items:center;padding:10px 12px;z-index:20}
.iconBtn{background:rgba(0,0,0,.45);border:none;color:#fff;width:42px;height:42px;border-radius:50%;font-size:24px}
.avatarBtn{background:#1a7a2a;border:none;color:#fff;width:42px;height:42px;border-radius:50%;font-weight:900;font-size:24px}
#modePill{position:absolute;bottom:108px;left:0;right:0;margin:0 auto;width:fit-content;display:flex;background:rgba(0,0,0,.6);border-radius:30px;padding:4px;z-index:20}
.modeBtn{padding:8px 16px;border-radius:20px;border:none;background:transparent;color:#ccc;font-weight:bold;font-size:24px}
.modeBtn.on{background:#fff;color:#000}
#goLive{position:absolute;bottom:48px;left:0;right:0;margin:0 auto;width:220px;background:#fff;color:#000;border:none;padding:13px;border-radius:30px;font-weight:900;z-index:20;font-size:24px}
#bottomTools{position:absolute;bottom:56px;left:0;right:0;display:flex;justify-content:space-between;align-items:center;padding:0 18px;z-index:19;pointer-events:none}
#bottomTools button{pointer-events:auto;background:transparent;border:none;color:#fff;font-size:28px}
#liveTopBar{position:absolute;top:48px;left:0;right:0;display:none;z-index:30;padding:8px;background:rgba(0,0,0,.4)}
#app.is-live #liveTopBar{display:block}
#app.is-live #modePill,#app.is-live #goLive{display:none}
#nav{position:absolute;bottom:0;left:0;right:0;display:flex;background:linear-gradient(transparent,rgba(0,0,0,.8));padding:10px 0 8px;z-index:20}
#nav button{flex:1;background:none;border:none;color:#aaa;font-size:24px;font-weight:bold;padding:8px 0}
#nav button.active{color:#fff}
.sheet{position:fixed;inset:0;background:rgba(0,0,0,.6);display:none;align-items:flex-end;justify-content:center;z-index:100}
.sheet.show{display:flex}
.sheetCard{background:#1e1e1e;border-radius:20px 20px 0 0;width:100%;max-width:480px;padding:16px;max-height:82vh;overflow-y:auto}
.sheetCard button{width:100%;padding:12px;margin-top:8px;border:none;border-radius:10px;background:#1a73e8;color:#fff;font-weight:bold;font-size:24px}
.sheetCard input{width:100%;padding:12px;margin:6px 0;border-radius:10px;border:none;background:#222;color:#fff;font-size:24px}
.sheetCard .closeBtn{background:#333}
.destGrid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px;margin:12px 0}
.dest{background:#2a2a2a;border-radius:12px;padding:14px 6px;text-align:center;border:2px solid transparent;cursor:pointer}
.dest.on{border-color:#FFD700;background:#333}
.dest span{font-size:32px}
</style>
</head>

<div style="color:#fff;font-size:28px;margin-top:14px">For all your <span style="color:#FFD700;font-weight:bold">livestreaming journey</span></div>
