<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>JSTV Studio</title>
<link rel="icon" href="jstv_logo (1).png">
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;background:#000;color:#fff;font-family:Arial;height:100%;overflow:hidden}
#stage{position:fixed;inset:0;background:#111}
#cam{width:100%;height:100%;object-fit:cover}
.top{position:fixed;top:0;left:0;right:0;display:flex;justify-content:space-between;padding:12px;z-index:20}
.icon{width:44px;height:44px;border-radius:50%;background:rgba(0,0,0,.5);display:flex;align-items:center;justify-content:center;font-size:20px;border:none;color:#fff}
.icon.green{background:#1a7a2a}
.overlay{position:absolute;touch-action:none;cursor:move;z-index:15}
#logoBox{top:60px;left:12px;width:100px}
#logoBox img{width:100%;border-radius:12px;display:block}
#titleBox{top:175px;left:12px;right:12px;text-align:center;font-size:30px;font-weight:900;text-shadow:0 2px 10px #000}
#loopBox{top:220px;left:12px;background:#FF0000;padding:7px 12px;border-radius:18px;font-weight:900;font-size:15px}
#tickerWrap{position:absolute;left:0;right:0;bottom:165px;overflow:hidden;background:rgba(0,0,0,.6);padding:9px 0;z-index:15}
#ticker{white-space:nowrap;display:inline-block;animation:scroll 15s linear infinite;font-size:19px;font-weight:bold;color:#FFD700}
@keyframes scroll{from{transform:translateX(100vw)}to{transform:translateX(-100%)}}
.modes{position:fixed;bottom:125px;left:0;right:0;display:flex;justify-content:center;z-index:20}
.modes-in{background:rgba(0,0,0,.65);border-radius:30px;padding:4px;display:flex}
.modes-in button{border:none;padding:9px 16px;border-radius:24px;background:transparent;color:#ccc;font-size:15px;font-weight:bold}
.modes-in button.on{background:#fff;color:#000}
.ready-wrap{position:fixed;bottom:70px;left:0;right:0;display:flex;justify-content:center;align-items:center;gap:20px;z-index:20}
.ready{background:#fff;color:#000;border:none;padding:14px 44px;border-radius:30px;font-size:20px;font-weight:900}
.small-btn{width:44px;height:44px;border-radius:50%;background:rgba(0,0,0,.5);border:none;color:#fff;font-size:18px}
.bottom{position:fixed;bottom:0;left:0;right:0;background:rgba(0,0,0,.75);display:flex;justify-content:space-around;padding:14px 5px 10px;z-index:20}
.bottom button{background:none;border:none;color:#888;font-size:15px;font-weight:bold;letter-spacing:1px}
.bottom button.on{color:#fff}
#panel{position:fixed;left:0;right:0;bottom:0;background:#111;padding:16px;border-radius:20px 20px 0 0;z-index:40;display:none;max-height:78vh;overflow:auto}
#panel input{width:100%;padding:14px;margin:6px 0;border-radius:10px;border:1px solid #333;background:#222;color:#fff;font-size:16px}
#panel label{font-size:13px;color:#FFD700;font-weight:bold}
.close{float:right;background:#333;color:#fff;border:none;padding:8px 14px;border-radius:10px}
.btn{width:100%;background:#FFD700;color:#000;border:none;padding:15px;border-radius:12px;font-weight:900;font-size:17px;margin-top:8px}
.btn2{width:100%;background:#222;color:#fff;border:none;padding:13px;border-radius:12px;font-size:15px;margin-top:6px}
</style>
</head>
<body>
<div id="stage"><video id="cam" autoplay playsinline muted></video>
<div id="logoBox" class="overlay"><img src="jstv_logo (1).png"></div>
<div id="titleBox" class="overlay" contenteditable="true">JSTV LIVE</div>
<div id="loopBox" class="overlay">🔴 LIVE • LOOP</div>
<div id="tickerWrap"><div id="ticker">✦ WELCOME TO JSTV ✦ JESUS IS LORD ✦ SHARE THIS LIVE ✦</div></div>
</div>

<div class="top">
<button class="icon" onclick="openPanel('setup')">⋯</button>
<button class="icon" onclick="flip()">🔄</button>
<button class="icon" onclick="toggleEl('logoBox')">🖼️</button>
<button class="icon" onclick="openPanel('live')">⚙️</button>
<button class="icon green">A</button>
</div>

<div class="modes"><div class="modes-in">
<button onclick="setMode(this,'Screen')">Screen</button>
<button class="on" onclick="setMode(this,'Camera')">Camera</button>
<button onclick="setMode(this,'VTuber')">VTuber</button>
</div></div>

<div class="ready-wrap">
<button class="small-btn" onclick="openPanel('setup')">✨</button>
<button class="ready" id="readyBtn" onclick="goLive()">Ready</button>
<button class="small-btn" onclick="openPanel('live')">⚙️<br><span style="font-size:9px">OFF</span></button>
</div>

<div class="bottom">
<button onclick="openPanel('live')">CONNECT</button>
<button class="on" onclick="goLive()">LIVE</button>
<button onclick="openPanel('setup')">VIDEO</button>
<button onclick="openPanel('setup')">PHOTO</button>
</div>

<div id="panel">
<button class="close" onclick="closePanel()">✕ Close</button>
<div id="panel-setup" style="display:none">
<h3>⚙️ SETTINGS - All Editable</h3>
<label>Title - Tap Title on screen to Edit</label>
<input id="titleInput" placeholder="Type Title" oninput="document.getElementById('titleBox').textContent=this.value">
<label>Title Size</label><input type="range" min="18" max="60" value="30" oninput="document.getElementById('titleBox').style.fontSize=this.value+'px'">
<label>Logo Size</label><input type="range" min="60" max="220" value="100" oninput="document.getElementById('logoBox').style.width=this.value+'px'">
<label>Scrolling Text</label><input id="tickInput" placeholder="Type scrolling text" oninput="document.getElementById('ticker').textContent=this.value">
<label>Loop Text</label><input id="loopInput" value="🔴 LIVE • LOOP" oninput="document.getElementById('loopBox').textContent=this.value">
<button class="btn2" onclick="toggleEl('logoBox')">Show / Hide Logo</button>
<button class="btn2" onclick="toggleEl('titleBox')">Show / Hide Title</button>
<button class="btn2" onclick="toggleEl('loopBox')">Show / Hide Loop</button>
<button class="btn2" onclick="toggleEl('tickerWrap')">Show / Hide Scrolling Text</button>
<p style="color:#888;font-size:13px">Tip: Hold Logo / Title / Loop and DRAG anywhere.</p>
</div>
<div id="panel-live" style="display:none">
<h3>📡 LIVE SETUP</h3>
<label>Facebook RTMP URL</label><input id="fbUrl" placeholder="rtmp://...">
<label>Facebook Stream Key</label><input id="fbKey" placeholder="Paste FB Key">
<label>YouTube RTMP URL</label><input id="ytUrl" value="rtmp://a.rtmp.youtube.com/live2">
<label>YouTube Stream Key</label><input id="ytKey" placeholder="Paste YT Key">
<label>Custom RTMP URL</label><input id="rtmpUrl" placeholder="rtmp://your-server/live">
<button class="btn" onclick="saveLive()">💾 Save Live Setup</button>
<p id="saveMsg" style="color:#FFD700"></p>
</div>
</div>

<script>
let stream=null,facing='user';
async function startCam(){
 try{if(stream)stream.getTracks().forEach(t=>t.stop());
 stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:facing},audio:true});
 document.getElementById('cam').srcObject=stream;}catch(e){}
}
function flip(){facing=facing==='user'?'environment':'user';startCam();}
function setMode(btn,mode){document.querySelectorAll('.modes-in button').forEach(b=>b.classList.remove('on'));btn.classList.add('on');}
function openPanel(w){document.getElementById('panel').style.display='block';document.getElementById('panel-setup').style.display=w==='setup'?'block':'none';document.getElementById('panel-live').style.display=w==='live'?'block':'none';}
function closePanel(){document.getElementById('panel').style.display='none';}
function toggleEl(id){let el=document.getElementById(id);el.style.display=el.style.display==='none'?'block':'none';}
function saveLive(){
 ['fbUrl','fbKey','ytUrl','ytKey','rtmpUrl'].forEach(k=>localStorage.setItem(k,document.getElementById(k).value));
 document.getElementById('saveMsg').textContent='✅ Saved! Ready to Go Live';
 document.getElementById('readyBtn').textContent='GO LIVE';
}
function goLive(){openPanel('live');}
['fbUrl','fbKey','ytUrl','ytKey','rtmpUrl'].forEach(k=>{if(localStorage.getItem(k))document.getElementById(k).value=localStorage.getItem(k);});
// DRAG
document.querySelectorAll('.overlay').forEach(el=>{
 let sx,sy,ox,oy,drag=false;
 el.addEventListener('touchstart',e=>{drag=true;let t=e.touches[0];sx=t.clientX;sy=t.clientY;ox=el.offsetLeft;oy=el.offsetTop;},{passive:true});
 el.addEventListener('touchmove',e=>{if(!drag)return;let t=e.touches[0];el.style.left=(ox+t.clientX-sx)+'px';el.style.top=(oy+t.clientY-sy)+'px';el.style.right='auto';},{passive:true});
 el.addEventListener('touchend',()=>drag=false);
 el.addEventListener('mousedown',e=>{drag=true;sx=e.clientX;sy=e.clientY;ox=el.offsetLeft;oy=el.offsetTop;});
 document.addEventListener('mousemove',e=>{if(!drag)return;el.style.left=(ox+e.clientX-sx)+'px';el.style.top=(oy+e.clientY-sy)+'px';el.style.right='auto';});
 document.addEventListener('mouseup',()=>drag=false);
});
startCam();
</script>
</body>
</html>
