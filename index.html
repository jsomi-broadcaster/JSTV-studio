<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>JSTV - Permissions</title>
<link rel="stylesheet" href="style.css">
<link rel="icon" href="jstv_logo (1).png">
</head>
<body>
<div class="page">
<img src="jstv_logo (1).png" class="logo-med">
<h2>Permissions</h2>
<p>We need Camera & Mic to go LIVE</p>
<p id="msg" class="small" style="color:#FFD700;font-size:16px;min-height:22px"></p>
<button class="btn" onclick="ask()">OK - ALLOW</button>
<a class="btn2" href="login.html">Next →</a>
<a class="btn2" href="index.html">Back</a>
</div>
<script>
async function ask(){
  try{
    let s = await navigator.mediaDevices.getUserMedia({video:true,audio:true});
    s.getTracks().forEach(t=>t.stop());
    document.getElementById('msg').textContent = '✅ Allowed! Tap Next';
  }catch(e){
    document.getElementById('msg').textContent = 'Please tap Allow in browser';
  }
}
</script>
</body>
</html>
