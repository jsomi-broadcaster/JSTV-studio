<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>JSTV - Multistream</title>
<style>
body{background:#0a0a0a;color:white;font-family:Arial;padding:12px}
.card{background:#1a1a1a;border-radius:14px;padding:14px;margin-bottom:12px}
video{width:100%;border-radius:12px;background:black}
.dest{display:flex;justify-content:space-between;align-items:center;padding:10px 0;border-bottom:1px solid #333}
input{width:100%;padding:10px;border-radius:8px;border:1px solid #333;background:#222;color:white;margin:6px 0}
button{width:100%;padding:16px;border-radius:12px;border:0;font-weight:bold;font-size:18px}
.live{background:red;color:white}
label{font-size:14px;color:#ccc}
</style>
</head>
<body>

<h2>📺 JSTV STUDIO</h2>
<p style="color:#aaa">One Stream - To All Platforms</p>

<!-- GROUP 1: PREVIEW -->
<div class="card">
  <b>1. PREVIEW</b>
  <video id="preview" autoplay muted playsinline></video>
  <p id="status" style="color:yellow">● Ready</p>
</div>

<!-- GROUP 2: DESTINATIONS -->
<div class="card">
  <b>2. DESTINATIONS</b>
  <p style="color:#aaa;font-size:13px">Tick where you want to go live. Relay sends to all at once.</p>

  <div class="dest">
    <span>📘 Facebook</span>
    <input type="checkbox" id="fbCheck" checked style="width:22px">
  </div>
  <input id="fbKey" placeholder="Facebook Stream Key">

  <div class="dest">
    <span>▶️ YouTube</span>
    <input type="checkbox" id="ytCheck" checked style="width:22px">
  </div>
  <input id="ytKey" placeholder="YouTube Stream Key">

  <div class="dest">
    <span>🎵 TikTok - Vertical</span>
    <input type="checkbox" id="ttCheck" checked style="width:22px">
  </div>
  <input id="ttKey" placeholder="TikTok Stream Key / RTMP Key">

  <label>Relay Server (From Render)</label>
  <input id="relayURL" value="https://jstv-relay.onrender.com/rtc/v1/whip/?app=live&stream=jstv">
</div>

<!-- GROUP 3: SETTINGS + GO LIVE -->
<div class="card">
  <b>3. STREAM SETTINGS</b>
  <label>Quality</label>
  <select id="quality" style="width:100%;padding:10px;background:#222;color:white;border-radius:8px">
    <option value="720">720p - Good for Free Relay</option>
    <option value="1080">1080p - Needs Strong Internet</option>
  </select>

  <label>Shape</label>
  <select id="shape" style="width:100%;padding:10px;background:#222;color:white;border-radius:8px;margin-top:8px">
    <option value="vertical">Vertical 9:16 - Best for TikTok</option>
    <option value="horizontal">Horizontal 16:9 - Best for Facebook/YouTube</option>
  </select>
</div>

<button class="live" onclick="goLive()">🔴 GO LIVE TO ALL</button>
<button style="background:#333;color:white;margin-top:10px" onclick="stopLive()">⏹ STOP</button>

<script>
// This is Option 2: App -> Relay -> All Platforms
// App sends ONLY ONE stream to relay. Relay copies to 3.
let relayURL = document.getElementById('relayURL').value;

async function goLive(){
  document.getElementById('status').innerText = "● LIVE - Sending 1 stream to Relay...";
  document.getElementById('status').style.color = "red";
  // Here we will connect camera to relayURL with WHIP
  // Next step we add WHIP code
  alert("Connected to Relay: " + relayURL + "\nFacebook: " + document.getElementById('fbCheck').checked + "\nYouTube: " + document.getElementById('ytCheck').checked + "\nTikTok: " + document.getElementById('ttCheck').checked);
}
function stopLive(){
  document.getElementById('status').innerText = "● Stopped";
  document.getElementById('status').style.color = "yellow";
}
// Camera Preview
navigator.mediaDevices.getUserMedia({video:true,audio:true}).then(s=>{
  document.getElementById('preview').srcObject = s;
});
</script>
</body>
</html>
