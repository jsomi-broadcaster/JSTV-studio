<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Settings - JSTV</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="page">
<h2>Stream Settings</h2>
<p>Paste your YouTube / Facebook Stream Key</p>

<input id="key" placeholder="Paste Stream Key Here">
<input id="url" placeholder="RTMP URL - leave empty">

<button class="btn" onclick="saveKey()">SAVE</button>
<a class="btn2" href="studio.html">Back to Studio</a>
<a class="btn2" href="index.html">Home</a>
<p class="small" id="saved">Not saved yet</p>
</div>
<script>
var k = localStorage.getItem('jstv_key');
if(k) document.getElementById('saved').textContent = 'Saved: ' + k.substring(0,4) + '****';
function saveKey(){
  var v = document.getElementById('key').value;
  localStorage.setItem('jstv_key', v);
  alert('Saved!');
  location.href='studio.html';
}
</script>
</body>
</html>
