<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>JSTV - Connecting...</title>
<style>body{background:#000;color:#fff;font-family:Arial;text-align:center;padding:40px;font-size:24px}button{padding:14px 30px;border:none;border-radius:30px;background:#FFD700;color:#000;font-weight:900;font-size:24px}</style>
</head>
<body>
<h2>JSTV - Connecting to Restream...</h2>
<p id="msg">Please wait...</p>
<button onclick="window.location.href='index.html'" style="display:none" id="backBtn">⬅ Back to JSTV Studio</button>
<script>
const CLIENT_ID = "e3352741-91a2-455a-a52b-97c66f34ef76";
const REDIRECT = "https://jsomi-broadcaster.github.io/JSTV-studio/callback.html";
async function run(){
  const params = new URLSearchParams(window.location.search);
  const code = params.get("code");
  const error = params.get("error");
  const msg = document.getElementById("msg");
  if(error){ msg.innerText = "Restream error: " + error; document.getElementById("backBtn").style.display="block"; return; }
  if(!code){ msg.innerText = "No code received."; document.getElementById("backBtn").style.display="block"; return; }

  msg.innerText = "Code received... exchanging for token...";
  const verifier = localStorage.getItem("jstv_pkce_verifier");
  try{
    const body = new URLSearchParams();
    body.append("grant_type", "authorization_code");
    body.append("client_id", CLIENT_ID);
    body.append("code", code);
    body.append("redirect_uri", REDIRECT);
    if(verifier) body.append("code_verifier", verifier);

    const res = await fetch("https://api.restream.io/oauth/token", {
      method: "POST",
      headers: { "Content-Type": "application/x-www-form-urlencoded" },
      body: body.toString()
    });
    const data = await res.json();
    if(data.access_token){
      localStorage.setItem("jstv_restream_token", data.access_token);
      localStorage.setItem("jstv_restream_refresh", data.refresh_token || "");
      localStorage.setItem("jstv_restream_code", code);
      msg.innerText = "✅ Connected! Token saved. Going back to Studio...";
    } else {
      // If token exchange fails, still save code so Step 8 can debug
      localStorage.setItem("jstv_restream_code", code);
      msg.innerText = "Code saved but token failed: " + JSON.stringify(data) + " - Going back...";
    }
  }catch(e){
    localStorage.setItem("jstv_restream_code", code);
    msg.innerText = "Token error: " + e.message + " - Code saved, going back...";
  }
  document.getElementById("backBtn").style.display="block";
  setTimeout(()=>{ window.location.href="index.html"; }, 2000);
}
run();
</script>
</body>
</html>
