<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Login - JSTV</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="page">
<h2>Login</h2>
<p>Welcome back to JSTV Studio</p>
<input id="phone" placeholder="Phone / Email">
<input id="code" placeholder="Code - type 1234">
<button class="btn" onclick="login()">Verify & Done</button>
<a class="btn2" href="permissions.html">Back</a>
</div>
<script>
function login(){
  var code = document.getElementById('code').value;
  if(code === '1234'){
    alert('Welcome to JSTV!');
    location.href='index.html';
  } else {
    alert('Wrong code. Type 1234');
  }
}
</script>
</body>
</html>
