<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Studio - JSTV</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="page">
<div class="top">
<div><b style="font-size:22px">JSTV</b> <span class="badge">LIVE READY</span></div>
<div><a href="settings.html" style="color:#fff;font-size:28px;text-decoration:none">...</a></div>
</div>

<video id="cam" autoplay playsinline muted></video>

<button class="btn" onclick="flip()">FLIP - Front / Back</button>

<div class="row">
<a href="#" onclick="setMode('live',this);return false" class="on">Live</a>
<a href="#" onclick="setMode('shorts',this);return false">Shorts</a>
<a href="#" onclick="setMode('record',this);return false">Record</a>
</div>

<br>

<div class="row">
<a href="#" onclick="setSrc('cam',this);return false" class="on">Camera</a>
<a href="#" onclick="setSrc('screen',this);return false">Screen</a>
<a href="#" onclick="setSrc('both',this);return false">Both</a>
</div>

<button class="btn" onclick="goLive()">GO LIVE / Ready</button>
<button class="btn2" onclick="startCam()">START CAMERA AGAIN</button>
<a class="btn2" href="settings.html">Stream Settings - YouTube / Facebook</a>
<a class="btn2" href="index.html">Back to Home</a>
<p class="small">Screen will NOT move. Tap buttons to change.</p>
</div>

<script src="app.js"></script>
</body>
</html>
